<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b14">
  <meta name="description" content="Rift Signal은 최근 전적을 KR 최상위 티어 기준과 비교해 개인 맞춤형 7일 훈련 루틴을 만듭니다.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>{% block title %}Rift Signal{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=1.4.0">
  {% block head %}{% endblock %}
</head>
<body class="page-{{ page }}">
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Rift Signal 홈">
      <span class="brand-mark" aria-hidden="true">R//S</span>
      <span class="brand-name">RIFT SIGNAL</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav">
      <span></span><span></span>
      <span class="sr-only">메뉴 열기 또는 닫기</span>
    </button>
    <nav class="main-nav" id="main-nav" aria-label="주요 메뉴">
      <a href="/" class="{% if page == 'home' %}active{% endif %}">홈</a>
      <a href="/analysis" class="{% if page == 'analysis' %}active{% endif %}">내 훈련</a>
      <a href="/growth" class="{% if page == 'growth' %}active{% endif %}">성장 기록</a>
    </nav>
    <a class="header-cta" href="/analysis">훈련 시작 <span>↗</span></a>
  </header>

  <main>{% block content %}{% endblock %}</main>

  <footer class="site-footer">
    <div>
      <span class="brand-name">RIFT SIGNAL</span>
      <p>다음 단계로 올라가기 위한 측정 가능한 훈련 루틴.</p>
    </div>
    <div class="footer-meta">
      <span>한국 플레이어를 위한 분석</span>
      <span>v1.4.0 한국어판 / FastAPI</span>
    </div>
  </footer>

  <script src="/js/app.js?v=1.4.0" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
